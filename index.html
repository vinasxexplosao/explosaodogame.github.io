<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explosão do Game – Loja Cyberpunk</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0a0f;
            color: #b3b0cc;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 255, 0.03) 0px,
                rgba(0, 255, 255, 0.03) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255, 0, 255, 0.08), transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px solid #00f0ff;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #00f0ff, #ff00ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            letter-spacing: 3px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
        }

        .nav-links a {
            color: #00f0ff;
            text-decoration: none;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .nav-links a:hover {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }

        /* SOCIAL ICONS (placeholder) */
        .social-icons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .social-icons a {
            color: #b3b0cc;
            font-size: 1.2rem;
            text-decoration: none;
            transition: color 0.3s;
        }

        .social-icons a:hover {
            color: #00f0ff;
        }

        /* FILTROS */
        .filtros {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 30px 0 20px;
            justify-content: center;
        }

        .filtro-btn {
            background: transparent;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            padding: 8px 18px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 0;
        }

        .filtro-btn:hover,
        .filtro-btn.ativo {
            background: #00f0ff;
            color: #0b0a0f;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.7);
        }

        /* GRID */
        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            margin: 30px 0;
        }

        .cartao {
            background: rgba(20, 18, 30, 0.95);
            border: 2px solid #2a2740;
            padding: 20px 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(2px);
            position: relative;
        }

        .cartao:hover {
            border-color: #ff00ff;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.3);
        }

        .cartao .categoria-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            color: #ff00ff;
            border: 1px solid #ff00ff;
            padding: 2px 10px;
            margin-bottom: 12px;
            display: inline-block;
            letter-spacing: 2px;
        }

        .cartao h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: #00f0ff;
            margin-bottom: 8px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cartao .descricao {
            font-size: 0.85rem;
            color: #8f8bb3;
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .cartao .preco {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: #ff00ff;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(255, 0, 255, 0.3);
        }

        .btn-comprar {
            display: inline-block;
            background: transparent;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            padding: 10px 20px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            width: 100%;
            text-align: center;
        }

        .btn-comprar:hover {
            background: #00f0ff;
            color: #0b0a0f;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
        }

        /* FOOTER */
        footer {
            margin-top: 50px;
            border-top: 2px solid #00f0ff;
            padding: 30px 0 20px;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .footer-links a {
            color: #00f0ff;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: #ff00ff;
        }

        .footer-legal {
            color: #6f6b8a;
            font-size: 0.75rem;
            letter-spacing: 2px;
            padding-top: 15px;
            border-top: 1px solid #2a2740;
        }

        .footer-legal a {
            color: #ff00ff;
            text-decoration: none;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .nav-links {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- NAVBAR -->
        <nav class="navbar">
            <div class="logo">⚡EXPLOSÃO DO GAME</div>
            <ul class="nav-links">
                <li><a href="#">Início</a></li>
                <li><a href="#">Ofertas</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
            <div class="social-icons">
                <a href="#" title="Instagram">📷</a>
                <a href="#" title="YouTube">▶</a>
                <a href="#" title="Twitter">🐦</a>
                <a href="#" title="Twitch">📺</a>
            </div>
        </nav>

        <!-- FILTROS -->
        <div class="filtros" id="filtros">
            <button class="filtro-btn ativo" data-categoria="todos">Todos</button>
            <button class="filtro-btn" data-categoria="hd-externo">HDs Externos</button>
            <button class="filtro-btn" data-categoria="ssd-sata">SSDs SATA</button>
            <button class="filtro-btn" data-categoria="ssd-nvme">SSDs NVMe</button>
            <button class="filtro-btn" data-categoria="consoles">Consoles e Acessórios</button>
            <button class="filtro-btn" data-categoria="homebrew">Homebrew/Flashcarts</button>
        </div>

        <!-- GRID DE PRODUTOS -->
        <div class="grid-produtos" id="grid-produtos"></div>

        <!-- FOOTER -->
        <footer>
            <div class="footer-links">
                <a href="#" title="Instagram">📷 Instagram</a>
                <a href="#" title="YouTube">▶ YouTube</a>
                <a href="#" title="Twitter">🐦 Twitter</a>
                <a href="#" title="Twitch">📺 Twitch</a>
                <a href="#" title="Discord">💬 Discord</a>
            </div>
            <div class="footer-legal">
                Como associado Amazon, eu recebo por compras qualificadas.<br>
                © 2025 Explosão do Game – Todos os direitos reservados.
            </div>
        </footer>
    </div>

    <script>
        (function() {
            // ---------- BASE DE DADOS DE PRODUTOS ----------
            const produtos = [
                // HDs Externos
                { nome: "Seagate Expansion 1TB", categoria: "hd-externo", asin: "B07D3R4H7Z", preco: "R$ 299,90" },
                { nome: "Seagate Expansion 2TB", categoria: "hd-externo", asin: "B07D3R5K9G", preco: "R$ 439,90" },
                { nome: "Seagate Expansion 4TB", categoria: "hd-externo", asin: "B07D3R6L8X", preco: "R$ 589,90" },
                { nome: "WD Elements 2TB", categoria: "hd-externo", asin: "B07YFJ6G8W", preco: "R$ 429,90" },
                { nome: "WD Elements 4TB", categoria: "hd-externo", asin: "B07YFJ9K3L", preco: "R$ 599,90" },
                { nome: "Toshiba Canvio Basics 1TB", categoria: "hd-externo", asin: "B07D3R4H7Z", preco: "R$ 279,90" },
                // SSDs SATA
                { nome: "Kingston A400 480GB", categoria: "ssd-sata", asin: "B07D3R4H7Z", preco: "R$ 259,90" },
                { nome: "Kingston A400 960GB", categoria: "ssd-sata", asin: "B07D3R5K9G", preco: "R$ 439,90" },
                { nome: "Crucial BX500 480GB", categoria: "ssd-sata", asin: "B07YFJ6G8W", preco: "R$ 269,90" },
                { nome: "Crucial BX500 1TB", categoria: "ssd-sata", asin: "B07YFJ9K3L", preco: "R$ 459,90" },
                { nome: "SanDisk SSD Plus 1TB", categoria: "ssd-sata", asin: "B07D3R6L8X", preco: "R$ 479,90" },
                // SSDs NVMe (foco PS5 com heatsink)
                { nome: "Samsung 980 Pro 1TB (c/ Heatsink)", categoria: "ssd-nvme", asin: "B08GSXPJLG", preco: "R$ 799,90" },
                { nome: "Samsung 980 Pro 2TB (c/ Heatsink)", categoria: "ssd-nvme", asin: "B08GSY9W1H", preco: "R$ 1.399,90" },
                { nome: "WD_BLACK SN850X 1TB", categoria: "ssd-nvme", asin: "B09JLSG9G3", preco: "R$ 749,90" },
                { nome: "WD_BLACK SN850X 2TB", categoria: "ssd-nvme", asin: "B09JLT3G9J", preco: "R$ 1.299,90" },
                { nome: "Kingston FURY Renegade 1TB", categoria: "ssd-nvme", asin: "B09H2WZ9P3", preco: "R$ 699,90" },
                { nome: "Crucial P5 Plus 1TB", categoria: "ssd-nvme", asin: "B09JLRC2DK", preco: "R$ 679,90" },
                // Consoles e Acessórios
                { nome: "PlayStation 5 (Versão Disco)", categoria: "consoles", asin: "B08FC5L3GK", preco: "R$ 3.999,90" },
                { nome: "Controle DualSense Branco", categoria: "consoles", asin: "B08FC5L3GK", preco: "R$ 399,90" },
                { nome: "Controle DualSense Preto", categoria: "consoles", asin: "B08FC6HZ5D", preco: "R$ 399,90" },
                { nome: "Controle DualSense Rosa", categoria: "consoles", asin: "B08FC7JZ6F", preco: "R$ 419,90" },
                { nome: "Nintendo Switch OLED", categoria: "consoles", asin: "B09LJ7Z9P3", preco: "R$ 2.499,90" },
                { nome: "Controle 8BitDo Ultimate", categoria: "consoles", asin: "B09JLSG9G3", preco: "R$ 299,90" },
                // Homebrew/Flashcarts
                { nome: "MicroSD SanDisk Extreme 64GB", categoria: "homebrew", asin: "B07YFJ6G8W", preco: "R$ 79,90" },
                { nome: "MicroSD SanDisk Extreme 128GB", categoria: "homebrew", asin: "B07YFJ9K3L", preco: "R$ 129,90" },
                { nome: "MicroSD SanDisk Extreme 256GB", categoria: "homebrew", asin: "B07D3R6L8X", preco: "R$ 229,90" },
                { nome: "Adaptador HDMI para Retro", categoria: "homebrew", asin: "B09H2WZ9P3", preco: "R$ 89,90" }
            ];

            // Função para gerar link de afiliado
            const gerarLink = (asin) => `https://www.amazon.com.br/dp/${asin}/?tag=explosaodogam-20`;

            // Renderizar produtos
            const grid = document.getElementById('grid-produtos');
            const filtroBotoes = document.querySelectorAll('.filtro-btn');

            function renderizar(categoriaFiltro = 'todos') {
                grid.innerHTML = '';
                const filtrados = categoriaFiltro === 'todos' 
                    ? produtos 
                    : produtos.filter(p => p.categoria === categoriaFiltro);

                if (filtrados.length === 0) {
                    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#6f6b8a;">Nenhum produto encontrado.</div>`;
                    return;
                }

                filtrados.forEach(prod => {
                    const card = document.createElement('div');
                    card.className = 'cartao';
                    card.dataset.categoria = prod.categoria;

                    let nomeCategoria = '';
                    switch(prod.categoria) {
                        case 'hd-externo': nomeCategoria = 'HD Externo'; break;
                        case 'ssd-sata': nomeCategoria = 'SSD SATA'; break;
                        case 'ssd-nvme': nomeCategoria = 'SSD NVMe'; break;
                        case 'consoles': nomeCategoria = 'Console/Acessório'; break;
                        case 'homebrew': nomeCategoria = 'Homebrew'; break;
                        default: nomeCategoria = prod.categoria;
                    }

                    card.innerHTML = `
                        <span class="categoria-tag">${nomeCategoria}</span>
                        <h3>${prod.nome}</h3>
                        <div class="descricao">Produto original lacrado. Garantia do fabricante.</div>
                        <div class="preco">${prod.preco}</div>
                        <a href="${gerarLink(prod.asin)}" target="_blank" rel="nofollow sponsored" class="btn-comprar">Comprar na Amazon</a>
                    `;
                    grid.appendChild(card);
                });
            }

            // Inicializar
            renderizar('todos');

            // Eventos de filtro
            filtroBotoes.forEach(btn => {
                btn.addEventListener('click', function() {
                    filtroBotoes.forEach(b => b.classList.remove('ativo'));
                    this.classList.add('ativo');
                    const cat = this.dataset.categoria;
                    renderizar(cat);
                });
            });
        })();
    </script>
</body>
</html>
